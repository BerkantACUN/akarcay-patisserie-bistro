<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menü — Akarçay Patisserie</title>
<meta name="description" content="Akarçay Patisserie menüsü: kahvaltı, pizzalar, et ve tavuk yemekleri, tatlılar, kahveler ve içecekler.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,560;1,9..144,400;1,9..144,480&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="menu-govde" data-tone="light">

<a class="skip-link" href="#gorunum-kategoriler">Menüye atla</a>

<!-- Sayfa geçiş perdesi -->
<div class="gecis" aria-hidden="true">
  <div class="gecis-katman"></div>
  <div class="gecis-katman"></div>
  <span class="gecis-amblem" data-logo="amblem"></span>
</div>

<span class="imlec" aria-hidden="true"></span>
<span class="imlec-nokta" aria-hidden="true"></span>

<main class="menu-sahne">

  <!-- ═══ Görünüm 1 · Kapak ═══ -->
  <section class="gorunum" id="gorunum-kapak" tabindex="0" role="button" aria-label="Menüyü aç">
    <div class="kapak-ic">
      <img class="kapak-amblem" src="assets/logo/akarcay-muhur.svg" width="168" height="168" alt="">
      <p class="kapak-ust">Akarçay Patisserie</p>
      <h1 class="kapak-baslik">Menü</h1>
      <p class="kapak-cizgi"><span>Lezzet · Kahve · Tatlı</span></p>
      <p class="kapak-slogan">Kahvaltıdan tatlıya, günün her anına yakışan tatlar.</p>
      <span class="btn kapak-btn">
        İçeriğe Göz At
        <svg class="ok" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0-5.5-5.5M19 12l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <p class="kapak-dokun">veya ekrana dokunun</p>
    </div>
  </section>

  <!-- ═══ Görünüm 2 · Kategoriler + Karşılama ═══ -->
  <section class="gorunum" id="gorunum-kategoriler" aria-label="Menü kategorileri">
    <div class="kat-sar">
      <nav class="kat-grid" id="kat-grid" aria-label="Kategoriler"></nav>

      <section class="hosgeldiniz-blok">
        <a class="hg-marka" href="index.html" data-gecis data-logo="yatay" aria-label="Akarçay Patisserie — Anasayfa"></a>
        <h2 class="hg-baslik" id="ic-hosgeldiniz"></h2>
        <span class="hg-cicek" aria-hidden="true"><svg viewBox="0 0 40 20"><use href="#cicek-ayrac"/></svg></span>
        <div class="hg-metin" id="ic-metin"></div>
        <div class="hg-alt" id="ic-alt" aria-hidden="true"></div>
      </section>
    </div>
  </section>

  <!-- ═══ Görünüm 3 · Detay ═══ -->
  <section class="gorunum" id="gorunum-detay" aria-label="Kategori detayı">
    <header class="detay-bar">
      <button class="geri-menu" type="button" id="detay-geri">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 5.5-5.5M5 12l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Ana Menü
      </button>
      <span class="detay-bar-baslik" id="detay-bar-baslik"></span>
    </header>
    <div class="detay-kaydir">
      <div class="detay-ic" id="detay-govde"></div>
    </div>
  </section>

</main>

<div class="mobil-menu" id="mobil-menu" aria-hidden="true"></div>

<!-- Fotoğraf büyütme -->
<div class="foto-buyut" id="foto-buyut" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Menü görseli">
  <button class="foto-buyut-kapat" type="button" aria-label="Kapat">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <img src="" alt="">
</div>

<!-- Süsleme sembolleri -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cicek-ayrac" viewBox="0 0 40 20">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M20 4c-1.5 2-1.5 5 0 7 1.5-2 1.5-5 0-7Z" fill="currentColor" stroke="none"/>
        <path d="M20 11c-2.5 1.5-6 1.5-9 0M20 11c2.5 1.5 6 1.5 9 0"/>
        <path d="M11 11c-1.5-1-3-1-4.5-.5M29 11c1.5-1 3-1 4.5-.5"/>
        <circle cx="20" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
    <symbol id="dal-suslemesi" viewBox="0 0 120 320">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
        <path d="M18 312C34 250 30 170 54 96 68 52 92 30 108 16"/>
        <g stroke-width="1.2">
          <path d="M40 190c-10-6-18-4-26 2M40 190c-2-11 2-19 10-25"/>
          <path d="M52 150c-10-6-18-4-26 2M52 150c-2-11 2-19 10-25"/>
          <path d="M66 112c-10-6-18-4-26 2M66 112c-2-11 2-19 10-25"/>
          <path d="M82 74c-10-6-18-4-26 2M82 74c-2-11 2-19 10-25"/>
          <path d="M32 232c-10-6-18-4-26 2M32 232c-2-11 2-19 10-25"/>
        </g>
      </g>
    </symbol>
    <symbol id="ic-yaprak" viewBox="0 0 16 16">
      <path d="M3 13c0-5 4-9 10-10-1 6-5 10-10 10Z" fill="currentColor" opacity="0.9"/>
      <path d="M3 13C6 10 9 8 12 6" fill="none" stroke="var(--paper-warm)" stroke-width="0.8" opacity="0.5"/>
    </symbol>
  </defs>
</svg>

<script src="js/utils.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/logo.js"></script>
<script src="js/intro.js"></script>
<script src="js/chrome.js"></script>
<script src="js/veri.js"></script>
<script src="js/menu-view.js"></script>
<script>
  (function () {
    "use strict";
    async function baslat() {
      AKAcilis.gecisleriBagla();
      AKArayuz.imlec();
      const menu = await AKVeri("/api/menu", window.AKAR_MENU);
      if (menu) new AKMenuAkis(menu);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", baslat);
    } else {
      baslat();
    }
  })();
</script>
</body>
</html>
